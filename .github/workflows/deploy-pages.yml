name: Deploy static content to Pages

# Replaces the legacy (Jekyll) Pages builder, which wedged on 2026-08-06 and
# failed every build ("Page build failed", duration 0s). This repo is a pure
# static site (.nojekyll), so we publish the tree as-is via the Pages actions.
#
# The `pages` concurrency group + `cancel-in-progress: false` means overlapping
# pushes QUEUE instead of cancelling each other — so even if several commits
# land in quick succession, each deploy runs to completion in order rather than
# thrashing the way the 12-commit burst did on 2026-08-06.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
